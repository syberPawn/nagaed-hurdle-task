# Serves the React build and forwards API requests to the backend services.
# The browser only talks to this one origin, so no CORS is needed.
# "user-api" and "ai-service" are Docker Compose service names.

# Docker's built-in DNS server. Backend addresses are looked up while Nginx runs
# (the "resolve" flag below), so Nginx starts even if a backend is not up yet,
# and keeps working when a backend container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream user_api {
    zone user_api 64k;
    server user-api:5000 resolve;
}

upstream ai_service {
    zone ai_service 64k;
    server ai-service:8000 resolve;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers for every response. "merge" keeps them in locations
    # that add their own headers (by default Nginx would drop them there).
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI service (exact match, so it wins over the /api/ prefix below)
    location = /api/suggest-username {
        proxy_pass http://ai_service;
    }

    # User API: /api/register, /api/login, /api/users/:id
    location /api/ {
        proxy_pass http://user_api;
    }

    # Vite puts a content hash in these file names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router: unknown paths (e.g. /dashboard on refresh) return index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
